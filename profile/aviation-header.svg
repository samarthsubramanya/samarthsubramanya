<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Samarth aviation-themed profile header</title>
  <desc id="desc">A navy flight deck inspired banner with a stylized aircraft, runway lines, navigation grid, and the text Mobile Engineer, AI Builder, Hardware Explorer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2942"/>
      <stop offset="1" stop-color="#123d59"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#59d9ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#59d9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8edfff" stroke-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 258 C240 214 420 276 620 238 S980 194 1200 228" fill="none" stroke="#59d9ff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M0 273 C240 229 420 291 620 253 S980 209 1200 243" fill="none" stroke="#59d9ff" stroke-opacity="0.1" stroke-width="1"/>

  <g opacity="0.75" fill="none" stroke="#ffc857" stroke-width="2">
    <circle cx="1030" cy="72" r="34"/>
    <path d="M1030 26V118M984 72H1076"/>
    <path d="M1007 49L1053 95M1053 49L1007 95" opacity="0.5"/>
  </g>
  <text x="1030" y="78" text-anchor="middle" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">FLIGHT</text>

  <g transform="translate(785 188) rotate(-12)" filter="url(#shadow)">
    <path d="M-270 16 L-68 5 L18 -11 L244 -5 L270 5 L244 15 L18 17 L-68 7 Z" fill="#f4f8fb"/>
    <path d="M-20 4 L42 -92 L70 -96 L51 2 Z" fill="#d7e8ef"/>
    <path d="M-15 14 L42 88 L70 92 L51 16 Z" fill="#d7e8ef"/>
    <path d="M-210 9 L-255 67 L-270 66 L-240 4 Z" fill="#b6d2dc"/>
    <path d="M-210 5 L-255 -47 L-270 -46 L-240 10 Z" fill="#b6d2dc"/>
    <path d="M-68 4 L20 3" stroke="#59d9ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="116" cy="4" r="15" fill="#123d59"/>
    <circle cx="116" cy="4" r="8" fill="#59d9ff"/>
    <path d="M238 -4 L270 5 L238 14 Z" fill="#ffc857"/>
  </g>

  <g fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="82" font-size="18" font-weight="600" letter-spacing="4" fill="#ffc857">WELCOME ABOARD</text>
    <text x="68" y="146" font-size="48" font-weight="800">SAMARTH</text>
    <rect x="72" y="166" width="220" height="3" rx="2" fill="url(#glow)"/>
    <text x="72" y="204" font-size="20" fill="#c9eaf4">Mobile Engineer · AI Builder · Hardware Explorer</text>
    <text x="72" y="239" font-size="14" fill="#8edfff" letter-spacing="1">BUILDING THE FUTURE, ONE FLIGHT PLAN AT A TIME</text>
  </g>

  <g transform="translate(72 282)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8edfff">
    <text x="0" y="0">ALT  //  IDEAS</text>
    <text x="142" y="0">HDG  //  INNOVATION</text>
    <text x="350" y="0">STATUS  //  BUILDING</text>
  </g>
</svg>
