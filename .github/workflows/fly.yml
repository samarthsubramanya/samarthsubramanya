name: Pixel Flight

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fly:
    if: startsWith(github.event.issue.title, 'fly:')
    runs-on: ubuntu-latest
    concurrency: pixel-flight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: move
        env:
          TITLE: ${{ github.event.issue.title }}
          PILOT: ${{ github.event.issue.user.login }}
        run: echo "result=$(python3 game/fly.py "$TITLE" "$PILOT")" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add game/
          git commit -m "✈️ ${{ github.event.issue.title }} by @${{ github.event.issue.user.login }}" && git push
      - env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.move.outputs.result == 'crash' && '💥 Crashed! A new flight has started. Thanks for flying.' || '✅ Move logged. Check the board on the profile.' }}
        run: gh issue close ${{ github.event.issue.number }} --comment "$MSG" --repo ${{ github.repository }}
